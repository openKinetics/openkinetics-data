services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ${OPENKINETICS_RUNTIME_HOST_DIR:-./runtime}:/data/runtime
      - ${OPENKINETICS_RELEASES_HOST_DIR:-./releases}:/data/releases
      - ${OPENKINETICS_SEQUENCE_INFO_HOST_DIR:-/home/saleh/webKinPred/media/sequence_info}:/sequence_info:ro
    expose:
      - "8010"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${OPENKINETICS_FRONTEND_BIND:-8082}:80"
    volumes:
      - ${OPENKINETICS_RELEASES_HOST_DIR:-./releases}:/srv/openkinetics/releases:ro
    restart: unless-stopped
